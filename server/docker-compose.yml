# Postgres só para desenvolvimento local, aberto só para esta máquina (127.0.0.1). Em produção o banco é o do Neon.
services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data

volumes:
  dados:

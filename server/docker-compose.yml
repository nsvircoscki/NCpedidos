# Postgres só para desenvolvimento local. Em produção o banco é o do Neon (DATABASE_URL).
services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    ports:
      - "5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data

volumes:
  dados:

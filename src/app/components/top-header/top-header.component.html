<header class="relative flex min-h-[70px] w-full items-center justify-center rounded-b-[15px] bg-white px-8 py-[15px]">
  <button
    type="button"
    (click)="abrirPesquisa()"
    aria-haspopup="dialog"
    [attr.aria-expanded]="pesquisaAberta"
    class="flex h-10 w-[400px] max-w-full items-center gap-2 rounded-full bg-[#f6f9fc] px-4 text-left text-sm font-semibold text-[#64748b] hover:bg-[#e8eef5] hover:text-[#153860]"
  >
    <img src="assets/img/searchIcon.svg" alt="" class="h-4 w-4" />
    <span>Pesquisar</span>
  </button>

  <a
    routerLink="/notificacoes"
    aria-label="Notificações"
    class="absolute right-8 grid h-10 w-10 place-items-center rounded-full text-slate-500 hover:bg-slate-100"
  >
    <img src="assets/notificationIcon.svg" alt="" class="h-6 w-6" />
  </a>
</header>

@if (pesquisaAberta) {
  <div
    class="fixed inset-0 z-50 bg-slate-900/30 p-4 pt-24"
    (click)="fecharPesquisa()"
  >
    <section
      role="dialog"
      aria-modal="true"
      aria-label="Pesquisar"
      class="relative mx-auto w-full max-w-2xl rounded-xl bg-white p-4 shadow-lg"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center gap-3 rounded-xl bg-[#f6f9fc] px-4">
        <img src="assets/img/searchIcon.svg" alt="" class="h-4 w-4" />

        <input
          type="search"
          [(ngModel)]="termoPesquisa"
          placeholder="O que você está buscando?"
          class="h-10 min-w-0 flex-1 bg-transparent text-sm outline-none"
        />

        @if (termoPesquisa.trim()) {
        <div class="absolute left-0 right-0 top-full z-10 mt-2 rounded-xl border border-slate-100 bg-white p-2 pt-2 shadow-lg">
            @for (pagina of paginasFiltradas; track pagina.rota) {
            <a
                [routerLink]="pagina.rota"
                (click)="fecharPesquisa()"
                class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
            >
                {{ pagina.nome }}
            </a>
            } @empty {
            <p class="px-3 py-2 text-sm text-slate-500">
                Nenhuma página encontrada.
            </p>
            }
        </div>
        }
        
        <button
          type="button"
          (click)="fecharPesquisa()"
          class="rounded-full px-2 py-1 text-sm text-[#64748b] hover:bg-[#e8eef5]"
        >
          Fechar
        </button>
      </div>
    </section>
  </div>
}

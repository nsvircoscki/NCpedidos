<div class="mb-3 flex items-center justify-between gap-4">
  <h2 class="titulo-secao">Cliente</h2>
  <button type="button" (click)="abrir()" class="text-xs font-bold text-[#153860] hover:underline dark:text-noite-marca">
    {{ selecionado() ? 'Alterar cliente' : 'Escolher cliente' }}
  </button>
</div>

<button
  type="button"
  (click)="abrir()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="aberto()"
  class="grid w-full min-w-0 grid-cols-[3.25rem_minmax(0,1fr)_1rem] items-center gap-3 rounded-[14px] border border-slate-200 bg-white p-3 text-left transition hover:border-slate-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#153d65] dark:border-noite-borda dark:bg-noite-card dark:hover:border-noite-suave dark:focus-visible:ring-noite-marca">
  @if (selecionado(); as cliente) {
    <span class="grid h-12 w-12 place-items-center rounded-full bg-[#edf6f3] text-xs font-bold text-[#153860] dark:bg-noite-sutil dark:text-noite-marca">
      {{ iniciais(cliente.nome) }}
    </span>
    <span class="flex min-w-0 flex-col">
      <strong class="truncate text-sm text-[#101b2b] dark:text-noite-texto">{{ cliente.nome }}</strong>
      <small class="mt-1 text-[10px] text-slate-500 dark:text-noite-suave">{{ cliente.documento }}</small>
      <small class="mt-0.5 flex items-center gap-1 truncate text-[10px] text-slate-500 dark:text-noite-suave">
        <svg aria-hidden="true" class="h-3 w-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11Z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        {{ localizacao(cliente) }}
      </small>
      @if (destaque()) {
        <span class="mt-2 w-fit rounded-md bg-[#edf6f3] px-2 py-1 text-[9px] font-semibold text-emerald-700 dark:bg-noite-sutil dark:text-emerald-200">
          ●&nbsp; {{ destaque() }}
        </span>
      }
    </span>
  } @else {
    <span class="grid h-12 w-12 place-items-center rounded-full bg-slate-100 text-xs font-bold text-slate-500 dark:bg-noite-sutil dark:text-noite-suave">—</span>
    <span class="flex min-w-0 flex-col">
      <strong class="truncate text-sm text-[#101b2b] dark:text-noite-texto">Selecione um cliente</strong>
      @if (destaque()) {
        <small class="mt-1 text-[10px] text-slate-500 dark:text-noite-suave">{{ destaque() }}</small>
      }
    </span>
  }
  <span class="text-2xl text-slate-500 dark:text-noite-suave" aria-hidden="true">›</span>
</button>

<!-- Fica sempre no HTML para o ngmMotion animar a entrada e a saída. -->
<div
  class="fixed inset-0 z-[60] flex items-center justify-center p-4"
  [class.pointer-events-none]="!aberto()"
  [attr.inert]="aberto() ? null : ''"
  [attr.aria-hidden]="!aberto()">
  <div
    class="absolute inset-0 bg-black/40"
    (click)="fechar()"
    ngmMotion
    [initial]="false"
    [animate]="{ opacity: aberto() ? 1 : 0 }"
    [transition]="{ duration: 0.2, ease: 'easeOut' }"
  ></div>

  <section
    role="dialog"
    aria-modal="true"
    aria-label="Selecionar cliente"
    ngmMotion
    [initial]="false"
    [animate]="{ opacity: aberto() ? 1 : 0, scale: aberto() ? 1 : 0.6 }"
    [transition]="aberto()
      ? { type: 'spring', stiffness: 380, damping: 18, mass: 0.8, opacity: { duration: 0.15 } }
      : { duration: 0.15, ease: 'easeIn' }"
    class="relative max-h-[85vh] w-full max-w-[440px] overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl dark:bg-noite-card">

    <div class="flex items-center justify-between">
      <h2 class="text-[16px] font-bold text-[#101b2b] dark:text-noite-texto">Selecionar cliente</h2>
      <button type="button" (click)="fechar()" aria-label="Fechar"
        class="grid h-9 w-9 place-items-center rounded-full text-[#68788c] hover:bg-[#f2f6fa] dark:text-noite-suave dark:hover:bg-noite-sutil">✕</button>
    </div>

    <input
      type="search"
      [ngModel]="busca()"
      (ngModelChange)="busca.set($event)"
      placeholder="Buscar nome, CPF, CNPJ ou cidade"
      aria-label="Buscar cliente"
      class="mt-4 h-10 w-full rounded-[12px] border border-[#e0e7ed] bg-[#f8fafc] px-3 text-[12px] text-[#475569] outline-none focus:border-[#153d65] dark:border-noite-borda dark:bg-noite-sutil dark:text-noite-texto dark:focus:border-noite-marca" />

    <div class="mt-3 space-y-2">
      @for (cliente of clientesFiltrados(); track cliente.id) {
        <button
          type="button"
          (click)="escolher(cliente)"
          [attr.aria-pressed]="estaSelecionado(cliente)"
          class="flex w-full items-center gap-3 rounded-xl border p-3 text-left transition hover:bg-[#f8fafc] dark:hover:bg-noite-sutil"
          [class.border-[#153d65]]="estaSelecionado(cliente)"
          [class.border-[#e0e7ed]]="!estaSelecionado(cliente)"
          [class.dark:border-noite-marca]="estaSelecionado(cliente)"
          [class.dark:border-noite-borda]="!estaSelecionado(cliente)">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-[#edf6f3] text-[11px] font-bold text-[#153860] dark:bg-noite-sutil dark:text-noite-marca">
            {{ iniciais(cliente.nome) }}
          </span>
          <span class="min-w-0 flex-1">
            <strong class="block truncate text-[13px] text-[#101b2b] dark:text-noite-texto">{{ cliente.nome }}</strong>
            <small class="block text-[10px] text-slate-500 dark:text-noite-suave">{{ cliente.documento }}</small>
            <small class="block truncate text-[10px] text-slate-500 dark:text-noite-suave">{{ localizacao(cliente) }}</small>
          </span>
          @if (estaSelecionado(cliente)) {
            <span aria-hidden="true" class="font-bold text-emerald-600 dark:text-emerald-300">✓</span>
          }
        </button>
      } @empty {
        <p class="py-6 text-center text-xs text-slate-500 dark:text-noite-suave">Nenhum cliente encontrado.</p>
      }
    </div>

    @if (permiteRemover() && selecionado()) {
      <button
        type="button"
        (click)="escolher(null)"
        class="mt-6 w-full rounded-full border border-[#e0e7ed] py-3 text-[12px] font-semibold text-[#68788c] hover:bg-slate-50 dark:border-noite-borda dark:text-noite-suave dark:hover:bg-noite-sutil">
        Remover seleção e usar preço base
      </button>
    }
  </section>
</div>

<button
  type="button"
  (click)="alternar()"
  aria-label="Abrir filtros"
  aria-haspopup="dialog"
  [attr.aria-expanded]="aberto()"
  class="relative grid h-12 w-12 shrink-0 place-items-center rounded-full border border-[#A9B6C5] bg-white text-[#153860] transition hover:border-[#153860] dark:bg-noite-card dark:text-noite-marca dark:hover:border-noite-marca"
  [class.border-[#153860]]="aberto()"
  [class.dark:border-noite-marca]="aberto()">
  <span aria-hidden="true" class="flex w-4 flex-col gap-1">
    <span class="h-0.5 w-full rounded-full bg-current"></span>
    <span class="h-0.5 w-full rounded-full bg-current"></span>
    <span class="h-0.5 w-full rounded-full bg-current"></span>
  </span>
  @if (totalAtivos() > 0) {
    <span class="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-[#153860] px-1 text-[10px] font-bold text-white">
      {{ totalAtivos() }}
    </span>
  }
</button>

<!-- Fica sempre no HTML para o ngmMotion animar a entrada e a saída. -->
<div
  class="fixed inset-0 z-[60] flex items-center justify-center p-4"
  [class.pointer-events-none]="!aberto()"
  [attr.inert]="aberto() ? null : ''"
  [attr.aria-hidden]="!aberto()">

  <div
    (click)="fechar()"
    ngmMotion
    [initial]="false"
    [animate]="{ opacity: aberto() ? 1 : 0 }"
    [transition]="{ duration: 0.2, ease: 'easeOut' }"
    class="absolute inset-0 bg-black/40"
  ></div>

  <!-- Pop-in -->
  <div
    ngmMotion
    [initial]="false"
    [animate]="{ opacity: aberto() ? 1 : 0, scale: aberto() ? 1 : 0.6 }"
    [transition]="aberto()
      ? { type: 'spring', stiffness: 380, damping: 18, mass: 0.8, opacity: { duration: 0.15 } }
      : { duration: 0.15, ease: 'easeIn' }"
    class="relative w-full max-w-lg">

    <!-- Gelatina: puxa para os lados e volta ao meio -->
    <section
      #modal
      role="dialog"
      aria-modal="true"
      aria-label="Filtros"
      ngmMotion
      drag="x"
      [dragX]="arrastoX"
      [dragConstraints]="limitesArrasto()"
      [dragElastic]="0.1"
      [dragSnapToOrigin]="true"
      [style]="estiloArrasto"
      [whileDrag]="{ boxShadow: '0 22px 52px rgba(21, 56, 96, 0.28)' }"
      class="max-h-[85vh] cursor-grab touch-pan-y select-none overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl active:cursor-grabbing dark:bg-noite-card">

      <div class="mb-4 flex items-center justify-between">
        <h2 class="titulo-cartao">Filtros</h2>
        <button
          type="button"
          (click)="fechar()"
          aria-label="Fechar filtros"
          class="grid h-9 w-9 place-items-center rounded-full text-[#68788c] hover:bg-[#f2f6fa] dark:text-noite-suave dark:hover:bg-noite-sutil">
          ✕
        </button>
      </div>

      <ng-content />

      <div class="mt-6 flex gap-2">
        <button
          type="button"
          (click)="limpar.emit()"
          class="flex-1 rounded-full border border-slate-200 py-2.5 text-xs font-semibold text-slate-600 transition hover:bg-slate-50 dark:border-noite-borda dark:text-slate-300 dark:hover:bg-noite-sutil">
          Limpar filtros
        </button>
        <button
          type="button"
          (click)="fechar()"
          class="flex-1 rounded-full bg-[#153860] py-2.5 text-xs font-semibold text-white transition hover:bg-[#0f2947]">
          Ver {{ totalResultados() }} {{ nomeResultados() }}
        </button>
      </div>
    </section>
  </div>
</div>

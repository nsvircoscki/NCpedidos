<form novalidate (submit)="enviar($event)" class="space-y-3">
  <div>
    <div class="label-input label-input--md [--label-input-bg:var(--fundo-formulario,#fff)]">
      <label class="label-input__label" [for]="prefixo() + '-nome'">Nome</label>
      <input [id]="prefixo() + '-nome'" autocomplete="off" placeholder=" " [formField]="formulario.nome"
        [attr.aria-invalid]="formulario.nome().touched() && formulario.nome().invalid()" [attr.aria-describedby]="prefixo() + '-erro-nome'"
        class="label-input__field h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-base outline-none focus:border-[#153860]" />
    </div>
    <app-erro-campo [campo]="formulario.nome" [id]="prefixo() + '-erro-nome'" />
  </div>

  <div class="grid grid-cols-[minmax(0,1fr)_5rem] gap-2">
    <div>
      <div class="label-input label-input--md [--label-input-bg:var(--fundo-formulario,#fff)]">
        <label class="label-input__label" [for]="prefixo() + '-cidade'">Cidade</label>
        <input [id]="prefixo() + '-cidade'" autocomplete="off" placeholder=" " [formField]="formulario.cidade"
          [attr.aria-invalid]="formulario.cidade().touched() && formulario.cidade().invalid()" [attr.aria-describedby]="prefixo() + '-erro-cidade'"
          class="label-input__field h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-base outline-none focus:border-[#153860]" />
      </div>
      <app-erro-campo [campo]="formulario.cidade" [id]="prefixo() + '-erro-cidade'" />
    </div>
    <div>
      <div class="label-input label-input--md [--label-input-bg:var(--fundo-formulario,#fff)]">
        <label class="label-input__label" [for]="prefixo() + '-uf'">UF</label>
        <input [id]="prefixo() + '-uf'" autocomplete="off" placeholder=" " [formField]="formulario.uf"
          [attr.aria-invalid]="formulario.uf().touched() && formulario.uf().invalid()" [attr.aria-describedby]="prefixo() + '-erro-uf'"
          class="label-input__field h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-base uppercase outline-none focus:border-[#153860]" />
      </div>
      <app-erro-campo [campo]="formulario.uf" [id]="prefixo() + '-erro-uf'" />
    </div>
  </div>

  <div>
    <div class="label-input label-input--md label-input--fixo [--label-input-bg:var(--fundo-formulario,#fff)]">
      <label class="label-input__label" [for]="prefixo() + '-representante'">Representante</label>
      <select [id]="prefixo() + '-representante'" [formField]="formulario.representanteId"
        [attr.aria-invalid]="formulario.representanteId().touched() && formulario.representanteId().invalid()" [attr.aria-describedby]="prefixo() + '-erro-representante'"
        class="label-input__field h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-base outline-none focus:border-[#153860]">
        <option value="">Escolha</option>
        @for (representante of representantes(); track representante.id) {
          <option [value]="representante.id">{{ representante.nome }}</option>
        }
      </select>
    </div>
    <app-erro-campo [campo]="formulario.representanteId" [id]="prefixo() + '-erro-representante'" />
  </div>

  <div>
    <div class="label-input label-input--md label-input--fixo [--label-input-bg:var(--fundo-formulario,#fff)]">
      <label class="label-input__label" [for]="prefixo() + '-tabela'">Tabela de preço</label>
      <select [id]="prefixo() + '-tabela'" [formField]="formulario.codigoTabela"
        [attr.aria-invalid]="formulario.codigoTabela().touched() && formulario.codigoTabela().invalid()" [attr.aria-describedby]="prefixo() + '-erro-tabela'"
        class="label-input__field h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-base outline-none focus:border-[#153860]">
        <option value="">Escolha</option>
        @for (tabela of tabelas(); track tabela.codigo) {
          <option [value]="tabela.codigo">{{ tabela.nome }} ({{ tabela.codigo }})</option>
        }
      </select>
    </div>
    <app-erro-campo [campo]="formulario.codigoTabela" [id]="prefixo() + '-erro-tabela'" />
  </div>

  <div class="grid gap-2" [class.grid-cols-2]="podeCancelar()">
    @if (podeCancelar()) {
      <button type="button" (click)="cancelar.emit()" class="botao-acao-secundario flex">Cancelar</button>
    }
    <button type="submit" [disabled]="salvando()" class="botao-acao botao-pop flex">{{ salvando() ? 'Salvando...' : textoSalvar() }}</button>
  </div>
  @if (erro()) {
    <p role="alert" class="text-xs font-semibold text-red-600">{{ erro() }}</p>
  }
</form>

<section class="flex flex-col overflow-hidden bg-transparent lg:rounded-xl lg:bg-white lg:shadow-[0px_8px_4px_#00000003]">
  <div class="flex flex-col gap-6 px-4 py-6 lg:gap-8 lg:px-11 lg:py-8">
    <header class="flex items-center gap-3">
      <div class="h-7 w-7 shrink-0 rounded-full bg-[#183869]"></div>
      <div>
        <h2 class="text-[17px] font-semibold text-slate-900 lg:text-2xl lg:font-bold">Endereço do cliente</h2>
        <p class="text-[10px] text-[#64748b] lg:text-sm lg:font-bold lg:text-[#A0ADC0]">
          Informe o endereço principal para entregas e atendimento.
        </p>
      </div>
    </header>

    <div class="grid gap-4 lg:grid-cols-[1fr_2fr_1fr] lg:gap-5">
      <label class="label-input flex flex-col gap-1 text-[10px] font-semibold text-[#414750] lg:text-base">
        <span class="label-input__label">CEP</span>
        <input
          name="cep"
          [(ngModel)]="cliente.cep"
          placeholder="00000-000"
          class="label-input__field h-12 rounded-[10px] border border-slate-200 bg-white px-3 text-[11px] text-[#0f172a] outline-none focus:border-[#2d5d8e] lg:h-16 lg:rounded-[41px] lg:px-6 lg:text-base">
      </label>

      <label class="label-input flex flex-col gap-1 text-[10px] font-semibold text-[#414750] lg:text-base">
        <span class="label-input__label">Logradouro</span>
        <input
          name="endereco"
          [(ngModel)]="cliente.endereco"
          placeholder="Rua, avenida e número"
          class="label-input__field h-12 rounded-[10px] border border-slate-200 bg-white px-3 text-[11px] text-[#0f172a] outline-none focus:border-[#2d5d8e] lg:h-16 lg:rounded-[41px] lg:px-6 lg:text-base">
      </label>

      <label class="label-input flex flex-col gap-1 text-[10px] font-semibold text-[#414750] lg:text-base">
        <span class="label-input__label">Número</span>
        <input
          name="numero"
          [(ngModel)]="cliente.numero"
          placeholder="Nº"
          class="label-input__field h-12 rounded-[10px] border border-slate-200 bg-white px-3 text-[11px] text-[#0f172a] outline-none focus:border-[#2d5d8e] lg:h-16 lg:rounded-[41px] lg:px-6 lg:text-base">
      </label>
    </div>

    <div class="grid gap-4 lg:grid-cols-3 lg:gap-5">
      <label class="label-input flex flex-col gap-1 text-[10px] font-semibold text-[#414750] lg:text-base">
        <span class="label-input__label">Bairro</span>
        <input
          name="bairro"
          [(ngModel)]="cliente.bairro"
          placeholder="Digite o bairro"
          class="label-input__field h-12 rounded-[10px] border border-slate-200 bg-white px-3 text-[11px] text-[#0f172a] outline-none focus:border-[#2d5d8e] lg:h-16 lg:rounded-[41px] lg:px-6 lg:text-base">
      </label>

      <label class="label-input flex flex-col gap-1 text-[10px] font-semibold text-[#414750] lg:text-base">
        <span class="label-input__label">Cidade</span>
        <input
          name="cidade"
          [(ngModel)]="cliente.cidade"
          placeholder="Cidade"
          class="label-input__field h-12 rounded-[10px] border border-slate-200 bg-white px-3 text-[11px] text-[#0f172a] outline-none focus:border-[#2d5d8e] lg:h-16 lg:rounded-[41px] lg:px-6 lg:text-base">
      </label>

      <label class="label-input flex flex-col gap-1 text-[10px] font-semibold text-[#414750] lg:text-base">
        <span class="label-input__label">UF</span>
        <input
          name="uf"
          maxlength="2"
          [(ngModel)]="cliente.uf"
          placeholder="UF"
          class="label-input__field h-12 rounded-[10px] border border-slate-200 bg-white px-3 text-[11px] uppercase text-[#0f172a] outline-none focus:border-[#2d5d8e] lg:h-16 lg:rounded-[41px] lg:px-6 lg:text-base">
      </label>
    </div>

    <div class="flex flex-col-reverse justify-between gap-3 sm:flex-row">
      <button
        type="button"
        (click)="cancelarCadastro()"
        class="rounded-[10px] border border-[#B5B5B5] bg-transparent px-5 py-3 text-[11px] font-bold text-black transition hover:bg-slate-50 lg:rounded-[41px] lg:px-10 lg:py-4 lg:text-base">
        Cancelar
      </button>

      <div class="flex flex-col gap-3 sm:flex-row">
        <button
          type="button"
          (click)="voltarEtapa()"
          class="rounded-[10px] border border-[#B5B5B5] px-5 py-3 text-[11px] font-bold text-slate-700 transition hover:bg-slate-50 lg:rounded-[41px] lg:px-8 lg:py-4 lg:text-base">
          Voltar
        </button>

        <button
          type="button"
          (click)="salvarPerfil()"
          class="flex items-center justify-center gap-2 rounded-[10px] bg-[#153860] px-5 py-3 text-[11px] font-bold text-white transition hover:bg-[#2d486f] lg:rounded-[41px] lg:px-8 lg:py-4 lg:text-base">
          Continuar
          <span class="text-xl leading-none">›</span>
        </button>
      </div>
    </div>
  </div>
</section>

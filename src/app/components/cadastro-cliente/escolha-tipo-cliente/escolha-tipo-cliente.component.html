<section class="w-full lg:rounded-2xl lg:bg-white lg:shadow-sm dark:lg:bg-noite-card">
  <div class="px-4 pb-8 pt-5 lg:px-7 lg:pb-10 lg:pt-7">
    <header class="mb-5 lg:mb-8">
      <h2 class="titulo-secao max-lg:text-[16px]">
        Quem você vai cadastrar?
      </h2>
      <p class="mt-1 text-[10px] text-[#64748b] lg:text-sm lg:font-semibold lg:text-[#a0adc0] dark:text-noite-suave">
        Escolha antes de começar: os campos do cadastro dependem do tipo de cliente.
      </p>
    </header>

    <!-- Uma opção por cartão. Clicar já escolhe e abre o formulário. -->
    <div class="grid gap-3 lg:grid-cols-2 lg:gap-5">
      @for (opcao of opcoes; track opcao.tipo) {
        <button
          type="button"
          (click)="escolher.emit(opcao.tipo)"
          class="botao-pop group flex items-center gap-4 rounded-[14px] border border-[#e2e8f0] bg-white p-4 text-left hover:border-[#183869] lg:h-[102px] lg:rounded-[50px] lg:border-[1.5px] lg:px-[30px] dark:border-noite-borda dark:bg-noite-card dark:hover:border-noite-marca"
        >
          <span
            class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-[#183869] text-[15px] font-bold text-white lg:h-12 lg:w-12 lg:text-xl"
          >
            {{ opcao.tipo }}
          </span>

          <span class="min-w-0 flex-1">
            <strong class="block text-[14px] font-semibold text-[#0f172a] lg:text-xl dark:text-noite-texto">
              {{ opcao.titulo }}
            </strong>
            <small class="mt-0.5 block text-[11px] text-[#64748b] lg:text-sm lg:font-semibold lg:text-[#a0adc0] dark:text-noite-suave">
              {{ opcao.descricao }}
            </small>
          </span>

          <span
            aria-hidden="true"
            class="text-2xl leading-none text-slate-500 dark:text-noite-suave transition-transform group-hover:translate-x-1 group-hover:text-[#183869] dark:group-hover:text-noite-marca"
          >›</span>
        </button>
      }
    </div>
  </div>
</section>

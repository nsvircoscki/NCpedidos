<section class="cartao min-h-[250px] w-[270px] px-2.5 py-3">
    <h2 class="titulo-cartao">Próximas entregas</h2>
    <p class="my-1 mb-5 text-[11px] text-slate-500 dark:text-slate-400">Agenda e situação das próximas rotas</p>

    @for (entrega of entregas; track entrega.horario) {
        <app-entrega-item [entrega]="entrega"></app-entrega-item>
    } 
</section>

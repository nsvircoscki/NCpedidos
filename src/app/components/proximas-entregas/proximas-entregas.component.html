<section class="cartao min-h-[250px] w-[270px] px-2.5 py-3">
    <h2 class="m-0 text-[13px] font-semibold leading-tight text-[#08111c] dark:text-noite-texto">Próximas entregas</h2>
    <p class="my-1 mb-5 text-[8px] text-slate-500 dark:text-slate-400">Agenda e situação das próximas rotas</p>

    @for (entrega of entregas; track entrega.horario) {
        <app-entrega-item [entrega]="entrega"></app-entrega-item>
    } 
</section>

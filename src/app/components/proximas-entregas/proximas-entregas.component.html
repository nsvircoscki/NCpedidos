<section class="min-h-[250px] w-[270px] rounded-xl bg-white px-2.5 py-3 shadow-sm">
    <h2 class="m-0 text-[13px] font-semibold leading-tight text-[#08111c]">Próximas entregas</h2>
    <p class="my-1 mb-5 text-[8px] text-slate-500">Agenda e situação das próximas rotas</p>

    @for (entrega of entregas; track entrega.horario) {
        <app-entrega-item [entrega]="entrega"></app-entrega-item>
    } 
</section>

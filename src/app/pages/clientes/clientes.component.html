<div class="flex min-h-screen bg-[#f6f9fc]">
  <app-sidebar></app-sidebar>

  <main
    class="flex min-w-0 flex-1 flex-col gap-6 px-8 pb-8 transition-[margin-left] duration-300"
    [class.ml-[265px]]="!sidebarMinimizada"
    [class.ml-[88px]]="sidebarMinimizada">
    
    <app-top-header></app-top-header>

    <section class="px-[17px] pt-4">
        <span class="text-[11px] font-bold uppercase tracking-[0.05em] text-[#153860]">
            CLIENTES
        </span>

        <div class="flex items-start justify-between gap-4 max-[700px]:flex-col">
            <div>
                <h1 class="my-1 text-[32px] font-bold text-[#08111c]">
                    Clientes
                </h1>

                <p class="m-0 text-[13px] text-slate-400">
                    Consulte os clientes cadastrados e o histórico de compras.
                </p>
            </div>

            <div class="flex items-center gap-3 self-end max-[700px]:self-start max-[700px]:flex-wrap">
                <button
                    type="button"
                    routerLink="/clientes/analise"
                    class="flex items-center gap-2 rounded-xl border border-[#2d486f] bg-white px-4 py-2 text-[11px] font-semibold text-[#2d486f] transition hover:bg-blue-50">
                    <svg
                        aria-hidden="true"
                        class="h-4 w-4"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M9 12.75 11.25 15 15 9.75M20.25 12A8.25 8.25 0 1 1 3.75 12a8.25 8.25 0 0 1 16.5 0Z" />
                    </svg>
                    <span class="text-[13px] font-semibold">Clientes em análise</span>
                </button>
                <button
                    type="button"
                    routerLink="/clientes/novo"
                    class="flex items-center gap-2 rounded-xl border-0 bg-[#2d486f] px-4 py-2 text-[11px] font-semibold text-white transition hover:bg-[#153860]">
                    <svg
                        aria-hidden="true"
                        class="h-4 w-4"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 5v14M5 12h14" />
                    </svg>
                    <span class="text-[14px] font-semibold text-white">Novo cliente</span>
                </button>
            </div>
        </div>
    </section>

    <section class="rounded-xl bg-white py-4 shadow-sm">
        <app-clientes-table [clientes]="clientes"></app-clientes-table>
    </section>
  </main>
</div>
